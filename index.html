<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IYOTENI | テニス部</title><link rel="stylesheet" href="style.css"><style>.hero-practice-time{display:block;font-size:clamp(23px,4.8vw,36px);font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px;position:relative;z-index:1}.practice-time{font-size:clamp(20px,4vw,27px);font-weight:800;color:#203e34;font-variant-numeric:tabular-nums;margin:7px 0 10px}.practice-time-inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.practice-time-inputs input{min-width:0}.calendar button{min-width:0;align-self:stretch}.calendar .calendar-practice-time{display:block;margin:3px 0 0;font-size:clamp(9px,1.5vw,11px);font-weight:650;color:#203e34;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.calendar .calendar-time-end{display:inline;background:none;padding:0;color:inherit;font-size:inherit;border-radius:0}@media(max-width:650px){.calendar .calendar-time-end{display:block}.calendar .calendar-practice-time{font-size:9px}}
/* 予定の種類ごとの配色。文字ラベルも併記する。 */
.kind-practice,.day-practice{--kind-bg:#dcfce7;--kind-ink:#166534;--kind-accent:#22a34a}
.kind-tournament,.day-tournament{--kind-bg:#fee2e2;--kind-ink:#991b1b;--kind-accent:#dc2626}
.kind-match,.day-match{--kind-bg:#dbeafe;--kind-ink:#1e40af;--kind-accent:#2563eb}
.kind-rest,.day-rest{--kind-bg:#e5e7eb;--kind-ink:#374151;--kind-accent:#6b7280}
.kind-other,.day-other{--kind-bg:#fef3c7;--kind-ink:#92400e;--kind-accent:#d97706}
.schedule-badge{display:inline-block;background:var(--kind-bg);color:var(--kind-ink);border:1px solid var(--kind-accent);padding:4px 9px;border-radius:20px;font-size:12px;font-weight:700;line-height:1.3;white-space:nowrap}
.schedule-legend{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px}.schedule-card{border-left:5px solid var(--kind-accent)}.schedule-card .practice-time{color:var(--kind-ink)}
.schedule-hero{border-left:6px solid var(--kind-accent)}.schedule-hero .schedule-badge{margin-left:8px;position:relative;z-index:1}.schedule-hero .hero-practice-time{color:var(--kind-bg)}
.calendar button.colored-day{background:#f1f5f1;padding:6px 2px;display:flex;flex-direction:column;align-items:stretch;gap:3px;justify-content:flex-start;overflow:hidden}.calendar button.colored-day[class*="day-"]{background:var(--kind-bg)}
.calendar .calendar-event{background:var(--kind-bg);color:var(--kind-ink);border-left:3px solid var(--kind-accent);padding:3px 1px;border-radius:4px;min-width:0;line-height:1.15}.calendar .calendar-event-label{display:block;background:none;color:inherit;font-size:10px;padding:0;border-radius:0;white-space:nowrap}.calendar .calendar-event .calendar-practice-time{color:inherit;margin:2px 0 0}.calendar .calendar-event .calendar-time-end{color:inherit}
#schedule-kind-preview{margin:-5px 0 14px}
@media(max-width:520px){.calendar button.colored-day{padding:5px 1px}.calendar .calendar-event{border-left-width:2px}.calendar .calendar-event-label{font-size:9px}.schedule-legend .schedule-badge{font-size:10px;padding:3px 6px}}
</style></head><body><header><div><small>IYO TENNIS CLUB</small><h1>IYOTENI<span>●</span></h1></div><button id="account">ログイン</button></header><main id="main"></main><nav id="nav"></nav><dialog id="modal"></dialog><div id="toast" role="status"></div><script type="module" src="app.js?v=3.3"></script></body></html>
